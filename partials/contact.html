  <!-- 8. CONTACT FORM -->
  <section id="contact" class="py-24 px-6 lg:px-12 bg-white border-t border-slate-200/60">
    <div class="max-w-3xl mx-auto bg-slate-50 border border-slate-200 rounded-3xl p-8 sm:p-12 shadow-sm">
      <div class="text-center mb-10">
        <h2 class="text-xs font-bold uppercase tracking-widest text-blue-600 mb-2" data-i18n="form_tag">Vrijblijvend Contact</h2>
        <h3 class="text-3xl font-extrabold text-slate-900" data-i18n="form_title">Start uw project vandaag</h3>
        <p class="text-xs text-slate-500 mt-2" data-i18n="form_sub">Vul het formulier in en ontvang binnen 24 uur een reactie en voorstel.</p>
      </div>

      <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
        <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2" data-i18n="form_name">Uw Naam</label>
            <input type="text" name="name" required placeholder="Jan de Boer" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2" data-i18n="form_email">E-mailadres</label>
            <input type="email" name="email" required placeholder="jan@bedrijf.nl" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2" data-i18n="form_company">Bedrijfsnaam of Website</label>
            <input type="text" name="company" placeholder="bijv. De Boer Timmerwerken" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-2" data-i18n="form_pkg_label">Gewenst Pakket</label>
            <select name="package" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white">
              <option value="starter">Starter (€349)</option>
              <option value="pro" selected>Professional (€499)</option>
              <option value="custom">Custom / Maatwerk</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-2" data-i18n="form_msg">Vertel kort over uw wensen</label>
          <textarea name="message" rows="4" placeholder="Wat voor website zoekt u en wat zijn uw belangrijkste doelen?" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white"></textarea>
        </div>

        <button type="submit" class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-lg shadow-blue-600/20 transition-all" data-i18n="form_btn">
          Aanvraag Verzenden &rarr;
        </button>
      </form>
    </div>
  </section>
