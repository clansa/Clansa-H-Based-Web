<!DOCTYPE html>
<html lang="nl-NL" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clansa Studio | Bliksemsnelle Websites</title>

  <!-- SEO & Geo-Targeting -->
  <meta name="description" content="Professionele en razendsnelle websites op maat voor lokale ondernemers in Nederland. Geen gedoe, direct online.">
  <link rel="alternate" hreflang="nl-NL" href="https://clansa.github.io/Clansa-H-Based-Web/" />
  <link rel="alternate" hreflang="x-default" href="https://clansa.github.io/Clansa-H-Based-Web/" />
  <link rel="canonical" href="https://clansa.github.io/Clansa-H-Based-Web/" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:locale" content="nl_NL">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Clansa Studio | Bliksemsnelle Websites">
  <meta property="og:description" content="Professionele en razendsnelle websites op maat voor lokale ondernemers.">
  <meta property="og:url" content="https://clansa.github.io/Clansa-H-Based-Web/">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Her bölüm ilgili partials/*.html dosyasından fetch ile buraya yükleniyor -->
  <!-- index.html -->
<div id="header-placeholder" class="sticky top-0 z-50"></div>
<div id="hero-placeholder"></div>
  <div id="hero-placeholder"></div>
  <div id="features-placeholder"></div>
  <div id="portfolio-placeholder"></div>
  <div id="pricing-placeholder"></div>
  <div id="faq-placeholder"></div>
  <div id="calculator-placeholder"></div>
  <div id="contact-placeholder"></div>
  <div id="footer-placeholder"></div>

  <!-- Site mantığı (çeviriler, hesaplayıcı, benchmark kartı vb.) -->
  <script src="js/script.js"></script>

  <!-- Bölümleri sırayla fetch edip ilgili div'e enjekte eden yükleyici -->
  <script>
    const partials = [
      { id: 'header-placeholder',     url: 'partials/header.html' },
      { id: 'hero-placeholder',       url: 'partials/hero.html' },
      { id: 'features-placeholder',   url: 'partials/features.html' },
      { id: 'portfolio-placeholder',  url: 'partials/portfolio.html' },
      { id: 'pricing-placeholder',    url: 'partials/pricing.html' },
      { id: 'faq-placeholder',        url: 'partials/faq.html' },
      { id: 'calculator-placeholder', url: 'partials/calculator.html' },
      { id: 'contact-placeholder',    url: 'partials/contact.html' },
      { id: 'footer-placeholder',     url: 'partials/footer.html' }
    ];

    Promise.all(
      partials.map(p =>
        fetch(p.url)
          .then(res => res.text())
          .then(html => {
            document.getElementById(p.id).innerHTML = html;
          })
      )
    ).then(() => {
      // Tüm bölümler DOM'a eklendi, artık script.js içindeki fonksiyonları
      // güvenle çalıştırabiliriz (elementler artık mevcut).
      switchLanguage('nl');
    });
  </script>
</body>
</html>
